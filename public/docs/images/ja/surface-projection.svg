<svg lang="ja" xml:lang="ja" xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
<title id="title">接平面への投影と曲面上に拘束した積分</title><desc id="desc">元の速度を接線成分と取り除く法線成分に分解し、球面またはトーラス面へ投影しながら中点法で積分する手順を示す、局所的な幾何学の模式図です。シミュレーションのスクリーンショットではありません。</desc>
<defs><marker id="mint" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a1e6c9"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#eabd72"/></marker><marker id="blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#76b7e4"/></marker></defs>
<rect width="1100" height="540" rx="10" fill="#101e2a"/><g font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Kaku Gothic ProN, Yu Gothic, Meiryo, Arial, sans-serif" fill="#dcebf1"><text x="32" y="43" font-size="22" font-weight="bold">曲面上を進み続ける</text><text x="32" y="72" font-size="13" fill="#9fb5c3">局所的な幾何学の模式図 • 単位法線 n • 数式で定義した球面またはトーラス面</text>
<path d="M32 94H1068" stroke="#29404e"/><text x="32" y="126" font-size="15" fill="#a1e6c9">1  法線成分を取り除く</text><path d="M70 370Q260 210 450 370" fill="none" stroke="#496d7b" stroke-width="3"/><path d="M70 370Q260 210 450 370L450 425H70Z" fill="#15333e" opacity=".55"/><path d="M80 290H457" stroke="#45616d" stroke-dasharray="5 7"/><circle cx="260" cy="290" r="6" fill="#edf6f6"/>
<path d="M260 290V155" stroke="#76b7e4" stroke-width="2.5" marker-end="url(#blue)"/><text x="273" y="165" font-size="15" fill="#76b7e4">単位法線 n</text>
<path d="M260 290L427 194" stroke="#eabd72" stroke-width="3.5" marker-end="url(#amber)"/><text x="392" y="173" font-size="16" fill="#eabd72">元の速度 v</text>
<path d="M260 290H427" stroke="#a1e6c9" stroke-width="4" marker-end="url(#mint)"/><text x="334" y="322" font-size="16" fill="#a1e6c9">接線速度 vₜ</text>
<path d="M427 290V194" stroke="#76b7e4" stroke-width="2" stroke-dasharray="5 5"/><text x="445" y="239" font-size="12" fill="#76b7e4">n(n · v)</text><text x="237" y="319" font-size="14">p</text><text x="152" y="389" font-size="13" fill="#9fb5c3">曲面の一部分を拡大</text>
<path d="M540 113V442" stroke="#29404e"/><text x="581" y="126" font-size="15" fill="#a1e6c9">2  積分の各段階で曲面へ投影する</text>
<g font-size="13"><rect x="581" y="151" width="457" height="68" rx="6" fill="#152e39" stroke="#365462"/><text x="600" y="177" font-weight="bold">曲面上の p から開始</text><text x="600" y="201" fill="#a9c1ce">接線速度 vₜ(p, t) を求める</text><path d="M808 222V241" stroke="#a1e6c9" stroke-width="2" marker-end="url(#mint)"/>
<rect x="581" y="250" width="457" height="68" rx="6" fill="#152e39" stroke="#365462"/><text x="600" y="276" font-weight="bold">仮の中点を曲面へ投影</text><text x="600" y="300" fill="#a9c1ce">m = P[p + (h/2) vₜ(p, t)]</text><path d="M808 321V340" stroke="#a1e6c9" stroke-width="2" marker-end="url(#mint)"/>
<rect x="581" y="349" width="457" height="68" rx="6" fill="#152e39" stroke="#365462"/><text x="600" y="375" font-weight="bold">中点の速度で1ステップ進め、曲面へ投影</text><text x="600" y="399" fill="#a9c1ce">p_next = P[p + h vₜ(m, t + h/2)]</text></g>
<path d="M32 454H1068" stroke="#29404e"/><text x="32" y="483" font-size="14" fill="#a1e6c9">vₜ = v − n(n · v)</text><text x="315" y="483" font-size="13" fill="#9fb5c3">P は球面・トーラス面への投影、h はシミュレーションの時間刻み</text><text x="32" y="515" font-size="12" fill="#eabd72">接線方向への制約だけでは、曲面上の発散がゼロになるとは限りません</text>
</g><metadata id="localization-provenance">{&quot;locale&quot;:&quot;ja&quot;,&quot;localizer&quot;:&quot;scripts/localize-doc-figures.mjs&quot;,&quot;version&quot;:1,&quot;sourceFile&quot;:&quot;../surface-projection.svg&quot;,&quot;sourceSha256&quot;:&quot;19ec140a84a7fc0b6263cf3fcbf9e7c62a9b7e2b76854fe6b331e098ddf68c6d&quot;,&quot;sourceLabelsSha256&quot;:&quot;a14f8cf922e0691923c0a7f9db084796237e34a9b7fe11a7f83b16713caadb1a&quot;,&quot;preservedDrawingSha256&quot;:&quot;543f95d4b7323b7382f980c5feff4949dbaaa93c757bb579e22a01fdc55dcf8e&quot;,&quot;sourceKind&quot;:&quot;geometric schematic&quot;}</metadata></svg>
