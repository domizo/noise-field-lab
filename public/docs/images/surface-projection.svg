<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
<title id="title">Tangent projection and constrained integration</title><desc id="desc">Local schematic of raw velocity split into a tangent component and a removed normal component, followed by projected midpoint integration on a sphere or torus. The illustration is geometric and is not a simulation screenshot.</desc>
<defs><marker id="mint" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a1e6c9"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#eabd72"/></marker><marker id="blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#76b7e4"/></marker></defs>
<rect width="1100" height="540" rx="10" fill="#101e2a"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#dcebf1"><text x="32" y="43" font-size="22" font-weight="bold">Stay on the surface</text><text x="32" y="72" font-size="13" fill="#9fb5c3">A local geometric schematic • unit normal n • analytic sphere or torus</text>
<path d="M32 94H1068" stroke="#29404e"/><text x="32" y="126" font-size="15" fill="#a1e6c9">1  Remove the normal component</text><path d="M70 370Q260 210 450 370" fill="none" stroke="#496d7b" stroke-width="3"/><path d="M70 370Q260 210 450 370L450 425H70Z" fill="#15333e" opacity=".55"/><path d="M80 290H457" stroke="#45616d" stroke-dasharray="5 7"/><circle cx="260" cy="290" r="6" fill="#edf6f6"/>
<path d="M260 290V155" stroke="#76b7e4" stroke-width="2.5" marker-end="url(#blue)"/><text x="273" y="165" font-size="15" fill="#76b7e4">unit normal n</text>
<path d="M260 290L427 194" stroke="#eabd72" stroke-width="3.5" marker-end="url(#amber)"/><text x="392" y="173" font-size="16" fill="#eabd72">raw v</text>
<path d="M260 290H427" stroke="#a1e6c9" stroke-width="4" marker-end="url(#mint)"/><text x="334" y="322" font-size="16" fill="#a1e6c9">tangent vₜ</text>
<path d="M427 290V194" stroke="#76b7e4" stroke-width="2" stroke-dasharray="5 5"/><text x="445" y="239" font-size="12" fill="#76b7e4">n(n · v)</text><text x="237" y="319" font-size="14">p</text><text x="152" y="389" font-size="13" fill="#9fb5c3">Curved surface, viewed locally</text>
<path d="M540 113V442" stroke="#29404e"/><text x="581" y="126" font-size="15" fill="#a1e6c9">2  Project each integration stage</text>
<g font-size="13"><rect x="581" y="151" width="457" height="68" rx="6" fill="#152e39" stroke="#365462"/><text x="600" y="177" font-weight="bold">Start at p on the surface</text><text x="600" y="201" fill="#a9c1ce">Compute tangent velocity vₜ(p, t).</text><path d="M808 222V241" stroke="#a1e6c9" stroke-width="2" marker-end="url(#mint)"/>
<rect x="581" y="250" width="457" height="68" rx="6" fill="#152e39" stroke="#365462"/><text x="600" y="276" font-weight="bold">Project the trial midpoint</text><text x="600" y="300" fill="#a9c1ce">m = P[p + (h/2) vₜ(p, t)]</text><path d="M808 321V340" stroke="#a1e6c9" stroke-width="2" marker-end="url(#mint)"/>
<rect x="581" y="349" width="457" height="68" rx="6" fill="#152e39" stroke="#365462"/><text x="600" y="375" font-weight="bold">Project the full step using the midpoint</text><text x="600" y="399" fill="#a9c1ce">p_next = P[p + h vₜ(m, t + h/2)]</text></g>
<path d="M32 454H1068" stroke="#29404e"/><text x="32" y="483" font-size="14" fill="#a1e6c9">vₜ = v − n(n · v)</text><text x="315" y="483" font-size="13" fill="#9fb5c3">P projects onto the sphere or torus; h is a simulation step.</text><text x="32" y="515" font-size="12" fill="#eabd72">Tangency constrains direction. It does not guarantee zero surface divergence.</text>
</g></svg>
